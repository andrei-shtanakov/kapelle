# team-exp для behaviour-конвейера devtools.
# Источник формы — devtools profiles/team-exp.yaml (канон конвейера:
# 6 авторимых узлов + delegate-узел tasks; acceptance доставлен
# devtools#155). Узлы: charter → requirements → behaviour-spec → design →
# acceptance → decomposition → tasks (delegate). До этой правки здесь
# лежала копия смоук-эры (WS-SMOKE-001: 3 авторимых узла + tasks) — на
# ней полный runner останавливался stopped_preflight.
# Бандл WS-kapelle-47 авторен под старой формой и ЗАКРЫТ (его tasks-спека
# approved и отработана): переоценке под новым профилем не подлежит;
# легаси-доставка таких бандлов — --legacy-bundle=3 у task_bridge.
profile: team-exp
solo_auto_approve: true
artifacts:
  - {id: charter, template: charter.md, owner_role: product, upstream: []}
  - id: requirements
    template: requirements.md
    owner_role: product
    upstream: [charter]
  - id: behaviour-spec
    template: behaviour-spec.md
    owner_role: product
    upstream: [requirements]
  - {id: design, template: design.md, owner_role: architects,
     upstream: [requirements, behaviour-spec]}
  - id: acceptance
    template: acceptance.md
    owner_role: qa
    upstream: [requirements, behaviour-spec]
  - id: decomposition
    template: decomposition.md
    owner_role: tech-lead
    # compile: decomposition→maestro/project.yaml НЕ реализуется (лейн
    # Mode-2) — осознанное отступление, §2/§8 спеки acceptance-узла.
    upstream: [design, acceptance]
  - id: tasks
    owner_role: stream-owner
    upstream: [decomposition]
    delegate: spec-runner
