# spec-runner v2 config — kapelle battle-testing S1
# Fixed agent (no arbiter at S1); human merges via integration branch.
#
# COMMITTED ON PURPOSE: this file governs merge mode (integration_pr) and the
# test oracle. When it is missing, spec-runner silently falls back to defaults
# (pytest, self-merge to master) — ecosystem battle-log findings F-17/F-18.

max_retries: 2
task_timeout_minutes: 30
claude_command: "claude"
claude_model: "sonnet" # fixed S1 agent — keep identical across all S1 runs

# One branch per run, single PR at the end, human reviews and merges;
# master is never touched by the tool.
integration_pr: true

budget_usd: 15.0
task_budget_usd: 5.0

hooks:
  pre_start:
    create_git_branch: true
  post_done:
    run_tests: true
    run_lint: true
    lint_blocking: true
    auto_commit: true
    run_review: true # review_command empty => same claude surface

commands:
  test: "mix test"
  lint: "mix format --check-formatted && mix credo"
  lint_fix: "mix format"
